# 独立配置界面直接使用 Cloth 的页面构建 API。
[[dependencies.${mod_id}]]
modId="cloth_config"
mandatory=true
versionRange="[11,)"
ordering="AFTER"
side="CLIENT"

# Jade 在两端发现 provider，JEI 仅在客户端发现插件。
[[dependencies.${mod_id}]]
modId="jade"
mandatory=false
versionRange="[11,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="[15,)"
ordering="AFTER"
side="CLIENT"
