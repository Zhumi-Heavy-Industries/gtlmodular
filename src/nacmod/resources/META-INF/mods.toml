modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="GTL 纳米芯片组装复合体"
authors="小爱与大肥鱼"
description='''
GTL 纳米芯片组装复合体（NAC）独立模组，包含主机、模块、真空物流及配套电路组件。
gtlmodular 与 gtl_nac 二选一，请勿同时安装；已双装时请移除其中一个。
Install either gtlmodular or gtl_nac. If both are installed, remove one of them.
'''

[[mixins]]
config="gtl_nac.mixins.json"

# 两个产物共享包名，必须在 Forge 建立 GAME 层前拒绝双装。
# Maven 认为 0 与 0.0 的边界等值；上界排除使区间恒空，范围文本会进入 Forge 报错。
[[dependencies.${mod_id}]]
modId="gtlmodular"
mandatory=false
versionRange="[0-gtlmodular 与 gtl_nac 二选一；移除其中一个 / choose one; remove either mod,0.0-gtlmodular 与 gtl_nac 二选一；移除其中一个 / choose one; remove either mod)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[47.3.7,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="gtceu"
mandatory=true
versionRange="[1.4.4,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ldlib"
mandatory=true
versionRange="[1.0.33.b,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
mandatory=true
versionRange="[15,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="gtlcore"
mandatory=true
versionRange="[1.2.3.2-fix4,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="gtladditions"
mandatory=true
versionRange="[3.3.1Custom_SubSpace,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
