# 复合体玻璃（Nanochip Complex Glass）—— 连接纹理（CTM，5 格 compact）
# 逐字节照抄 GTNH 2.9.0-beta-2 `gregtech-5.09.54.20.jar`
#   assets/gregtech/mcpatcher/ctm/blockglass1/nanochipglass/nanochipglass.properties
# 原版是 `matchBlocks=gregtech:gt.blockglass1` + `metadata=8`（GT5U 的元数据方块）；
# 我们用的是注册名方块、模型直接引用贴图，所以改成 `matchTiles=` + `connect=tile`（语义等价）。
#
# 贴图核对：本目录 0.png 与我们 `textures/block/nanochip_complex_glass.png` **逐像素相同**
# （即原版 iconset 那张就是"孤立变体"）；1..4 是连接状态变体。
# ★ 语义（2026-09-16 逐张解码 16×16 像素实测，**旧注释写的"2=水平/3=竖直"是反的**）：
#   tile 0 = 四边都有白线（孤立窗格）      tile 1 = 完全没有线（四边全连通）
#   tile 2 = 只有左右有线 ⇒ **上下开口** ⇒ 给「上下邻居连通」用
#   tile 3 = 只有上下有线 ⇒ **左右开口** ⇒ 给「左右邻居连通」用
#   tile 4 = 只有四角各 2×2 有线（角部/内角变体）
#   判据一句话：**哪边连通，那张 tile 就必须在那边"无线"**（见审计文档 §5.3 的更正段）。
#
# ⚠️ **`method` 拼写差异（务必留意）**：本文件用的是 **MCPatcher 拼写 `compact`**（= GTNH 原版逐字节照抄）。
#   OptiFine 官方规范写的是 **`ctm_compact`**（"Compact 8-way method, uses 5 tiles"），
#   且把规范路径放在 `assets/<ns>/optifine/ctm/**`。
#   ⇒ 换消费者时要按**消费端实际接受的写法**决定：
#     · MCPatcher 系 / Angelica 内置 MCPatcher ⇒ 保持 `compact` ✓（就是现在这份）；
#     · OptiFine 系 ⇒ 需改成 `ctm_compact`（并可考虑 `optifine/ctm/` 路径）。
#   机壳那条用的是 `method=ctm`，两种规范**拼写一致**，无需改。
#
# ⚠️ 生效前提：同 nanochipmeshinterfacecasing —— 需要客户端有 MCPatcher 系消费者；
#   **本包实测没有**（99 个 jar 全 0 命中，Fusion 也不认这个格式）⇒ 当前"随 jar 发布但不生效"。
matchTiles=gtlmodular:block/nanochip_complex_glass
method=compact
faces=all
tiles=0-4
connect=tile
