# 复合体玻璃（Nanochip Complex Glass）—— 连接纹理（CTM，5 格 compact）
# 照抄 GTNH 2.9.0-beta-2 `gregtech-5.09.54.20.jar` 的
#   assets/gregtech/mcpatcher/ctm/blockglass1/nanochipglass/nanochipglass.properties
# 原版是 `matchBlocks=gregtech:gt.blockglass1` + `metadata=8`（GT5U 的元数据方块）；
# 本模组用注册名方块、模型直接引用贴图，所以改成 `matchTiles=` + `connect=tile`（语义等价）。
#
# 0.png 与 textures/block/nanochip_complex_glass.png 逐像素相同（孤立窗格）；1..4 是连接状态变体：
#   tile 0 = 四边都有白线（孤立窗格）      tile 1 = 完全没有线（四边全连通）
#   tile 2 = 只有左右有线 ⇒ 上下开口 ⇒ 给「上下邻居连通」用
#   tile 3 = 只有上下有线 ⇒ 左右开口 ⇒ 给「左右邻居连通」用
#   tile 4 = 只有四角各 2×2 有线（角部/内角变体）
#   判据：哪边连通，那张 tile 就必须在那边无线。
#
# `method=compact` 是 MCPatcher 的拼写；OptiFine 要写成 `ctm_compact`（路径用 `optifine/ctm/`）。
# 和网格接口机械方块一样，1.20.1 下没有读取这套格式的模组，目前随 jar 发布但不生效。
matchTiles=gtlmodular:block/nanochip_complex_glass
method=compact
faces=all
tiles=0-4
connect=tile
