# 纳米芯片网格接口机械方块 —— 连接纹理（CTM）
# 逐字节照抄 GTNH 2.9.0-beta-2 `gregtech-5.09.54.20.jar`
#   assets/gregtech/mcpatcher/ctm/nanochipmeshinterfacecasing/nanochipmeshinterfacecasing.properties
# 只改了两处：matchTiles 指向我们自己的贴图路径（原版是 gregtech:iconsets/NANOCHIP_MESH_INTERFACE_CASING）。
#
# ★ 结构事实（2026-09-17 复核，**仍然成立**）：
#   · NH 全仓 `mcpatcher` properties 共 113 份 = compact 94 + compact_expanded 18 + **ctm 1**，
#     那唯一一份 `method=ctm` 就是本文件（`tiles=0-46` = 47 格）⇒ 原版这台机器的外壳
#     "花纹能连成一片"靠的正是它，不是普通方块贴图。
#   · 47 格完整映射表见 `_census/connected_texture_audit.md` **附录 A**
#     （已与 OptiFine `optifine_full.json` 的 47 条规则逐条对上 47/47）。
#   · 本目录 `0.png` 与 NH 的 iconsets 单图 `NANOCHIP_MESH_INTERFACE_CASING.png`、以及我们自己的
#     基础贴图 `textures/block/casings/nanochip_mesh_interface_casing.png` **三者 sha256 完全相同**
#     （`71f9e9f9…`）⇒ 不接 CTM 时每块都画"孤立变体"（这就是本文件存在的理由）。
#   · Fusion 不认这个格式（首查结论：「全 jar 扫 mcpatcher 命中 0」）—— 本轮**未复核**，仅作参考保留。
#
# ★ 事实核查（2026-09-16 首查 / 2026-09-17 复核者指出旧结论有误后**重查**；两条证据都留在这里）
#   ① 实现确实存在，但**只存在于 MC 1.7.10 侧**：
#      Angelica 2.1.50 的发行包里含完整 `com/prupe/mcpatcher/ctm/*`（29 个类，含
#      TileOverrideImpl$CTM / CTMCompact / CTMCompactExpanded / CTMUtils / CompactCtmQuadProcessor /
#      GlassPaneRenderer），并带 `META-INF/mcpatcherforge_at.cfg`；
#      CTM 的注入点是 `com/gtnewhorizons/angelica/mixins/early/mcpatcherforge/ctm/MixinRenderBlocks`
#      → 它混入的是 `RenderBlocks.getBlockIcon`（SRG `func_147793_a`），`CTMUtils`/`GlassPaneRenderer` 也调它。
#      **但 Angelica 2.1.50 是 MC 1.7.10 的 mod**：`mcmod.info` 写 `"mcversion": "1.7.10"`，
#      `MANIFEST.MF` 用的是 1.7.10 Forge 的加载方式（`FMLCorePlugin: …AngelicaTweaker` + `TweakClass: …MixinTweaker`）
#      ⇒ **本包是 MC 1.20.1 / Forge 47.4.16，装不了它**（也因此 1.20.1 侧永远不会出现
#      `mcpatcherforge.cfg` / `angelica-modules.cfg` 这两份 1.7.10 配置）。
#   ② 本包（1.20.1）当前**确实没有消费者** —— 但请连同上面的适用范围一起理解：
#      · 部署实例（日志所在目录 `…\profiles\GTL推荐新手玩版（较难）_versions_GTL`）的 `mods` 里没有 Angelica；
#        该实例 `logs/latest.log` 对 `angelica` **0 处命中**；
#        `config` 下没有 `mcpatcherforge.cfg`、也没有 `angelica-modules.cfg`。
#      · 本机 4 个启动器 profile 与 `D:\MC` 下各 GTL 实例/整合包 zip 深度搜索（各 10 层）同样 0 命中。
#      ⇒ 结论不是"没人实现这套格式"，而是"**这套格式的实现只属于 1.7.10，与 1.20.1 本包无关**"。
#   ③ **仍未定论的部分（不写死结论）**：即便换成 1.7.10 环境，机器面能不能吃到这套 CTM 也不能静态定论 ——
#      CTM 入口是 `RenderBlocks.getBlockIcon`，而 NH 整个 `gregtech` 包**0 处**引用 `func_147793_a`，
#      GT5U 的机器渲染走的是自研 ISBRH（`GTRendererBlock.renderWorldBlock` →
#      `renderStandardBlock(ISBRWorldContext, ITexture[][])`，不是 vanilla 的 `RenderBlocks.renderStandardBlock`）
#      ⇒ 静态看机器面大概率不过这个入口，但要定论只能实机对照。
#   ④ 我们据此做了什么：**资源照发**（与 NH 原文件逐字节一致，一份不删，将来环境变了还在），
#      但不把机器面的"连片"寄托在它身上 —— 本模组机器/机壳的连片由**我们自己的** `client/ctm` 包装器
#      （`CtmClientSetup.TARGETS`，日志可见已生效）负责，与这套 legacy 资源是两条独立路径。
#      （不装任何东西也能连的替代路线 = 模组内自绘，见审计文档 §⑦。）
matchTiles=gtlmodular:block/casings/nanochip_mesh_interface_casing
method=ctm
faces=all
tiles=0-46
connect=tile
