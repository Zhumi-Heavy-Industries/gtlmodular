# 纳米芯片网格接口机械方块 —— 连接纹理（CTM）
# 照抄 GTNH 2.9.0-beta-2 `gregtech-5.09.54.20.jar` 的
#   assets/gregtech/mcpatcher/ctm/nanochipmeshinterfacecasing/nanochipmeshinterfacecasing.properties
# 只改了 matchTiles，指向本模组的贴图（原版是 gregtech:iconsets/NANOCHIP_MESH_INTERFACE_CASING）。
#
# 共 47 格（tiles=0-46）；0.png 与基础贴图 textures/block/casings/nanochip_mesh_interface_casing.png 相同，是孤立变体。
# 这套 MCPatcher 格式只有 1.7.10 的 Angelica 实现，1.20.1 下没有读取它的模组，文件照原样保留。
# 本模组机器和机壳的连片由 client/ctm 包装器（CtmClientSetup.TARGETS）负责，和这里是两条独立路径。
matchTiles=gtlmodular:block/casings/nanochip_mesh_interface_casing
method=ctm
faces=all
tiles=0-46
connect=tile
