plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.gtlmodular'
// 版本号只在 gradle.properties 的 mod_version 里改；mods.toml 和 jar 名都从这里取。
// 换版本后 mods 目录里的旧 jar 必须删掉：同一个 modId 两份 jar，Forge 会以 "Duplicate mod" 拒绝加载。
version = mod_version
archivesBaseName = 'gtlmodular'

// [2026-09-20] 编译 JDK 提到 21：整合包里的 gtladditions 3.2.8Custom_SubSpace-fix2 是 Java 21
//   字节码（major 65），源代码真的 import 了它的 IThreadModifierPart / CommonUtils；
//   javac 17 读 major-65 的类会直接报 "class file has wrong version 65.0, should be 61.0"。
//   注意：编译用 21，产物目标仍锁 17（下面 options.release），jar 在 JVM 17/21 都能跑。
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 不设这一行，源码里的中文会被 javac 按 GBK 读坏（本文件必须按 UTF-8 保存）
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // JDK 21 编译、字节码目标 17（等价于 javac --release 17）：产物 class 仍是 major 61
    options.release = 17
}
tasks.withType(JavaExec).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

sourceSets {
    nac
    nacmod {
        compileClasspath += sourceSets.nac.output
        runtimeClasspath += sourceSets.nac.output
    }
    main {
        compileClasspath += sourceSets.nac.output
        runtimeClasspath += sourceSets.nac.output
    }
}

apply from: 'gradle/nac-resources.gradle'

// ForgeGradle 将映射后的 Minecraft/Forge 接入 implementation 的父配置；
// 只继承依赖配置，避免把 main 输出反向带入 NAC 编译。
configurations {
    nacImplementation.extendsFrom implementation
    nacCompileOnly.extendsFrom compileOnly
    nacRuntimeOnly.extendsFrom runtimeOnly
    nacAnnotationProcessor.extendsFrom annotationProcessor
    nacmodImplementation.extendsFrom implementation
    nacmodCompileOnly.extendsFrom compileOnly
    nacmodRuntimeOnly.extendsFrom runtimeOnly
    nacmodAnnotationProcessor.extendsFrom annotationProcessor
}

tasks.withType(JavaCompile).matching { it.name in ['compileNacJava', 'compileNacmodJava'] }.configureEach {
    // 禁止 javac 从 classpath 隐式寻找源码，保持源码根之间的单向依赖。
    options.sourcepath = files()
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                gtlmodular {
                    source sourceSets.main
                    source sourceSets.nac
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                gtlmodular {
                    source sourceSets.main
                    source sourceSets.nac
                }
            }
        }
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'gtlmodular', '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
            mods {
                gtlmodular {
                    source sourceSets.main
                    source sourceSets.nac
                }
            }
        }
        // ForgeGradle 按 run 名排序合并父配置，派生 run 必须排在 client/server 之后。
        standaloneClient {
            taskName 'runNacClient'
            parent minecraft.runs.client
            workingDirectory project.file('run-nac')
            setSources([sourceSets.nac, sourceSets.nacmod])
            mods {
                gtl_nac {
                    source sourceSets.nac
                    source sourceSets.nacmod
                }
            }
        }
        standaloneServer {
            taskName 'runNacServer'
            parent minecraft.runs.server
            workingDirectory project.file('run-nac')
            setSources([sourceSets.nac, sourceSets.nacmod])
            mods {
                gtl_nac {
                    source sourceSets.nac
                    source sourceSets.nacmod
                }
            }
        }
    }
}

// ForgeGradle 合并父 run 时也会合并 mods；独立启动只保留自己的源码和资源组。
afterEvaluate {
    [minecraft.runs.standaloneClient, minecraft.runs.standaloneServer].each { run ->
        run.mods.removeAll { it.name != 'gtl_nac' }
        run.setSources([sourceSets.nac, sourceSets.nacmod])
    }
}

repositories {
    // 依赖 jar 放在 libs/（不进 git，来源见 README.md）
    flatDir { dirs 'libs' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.7'

    // 依赖版本与 GTCEu 1.4.4 / LDLib 1.0.33.b 对齐（GTM 的传递依赖见下）
    // transitive=false：ldlib 会拖 ae2/kubejs/jei，本项目不需要 → 直接用 libs/ 下的本地 jar
    // [2026-09-15] ldlib 改用 libs/ 里的 jar：走 maven + fg.deobf 时，mapped 阶段取不到 DeobfuscatingRepo（null@pom）
    // [2026-09-20] libs/ 已同步实例当前一套：gtladditions fix2(Java21) / gtlcore 1.2.3.2-fix2 / ldlib 1.0.33.b
    // implementation fg.deobf('com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.33.b') { transitive = false }

    // 其余依赖全部来自 libs/ 下的本地 jar（含 gtceu-1.20.1-1.4.4 及其依赖）
    implementation fg.deobf(fileTree(dir: 'libs', include: ['*.jar']))
}

// ---------- 构建检查：gradlew build 会跑，不过就不能交付（规矩见 AGENTS.md） ----------

// 代码里带日期的行（流水账式注释）只许减少：历史写进 git 提交信息，玩家可见的变化写进 CHANGELOG.md。
tasks.register('checkDatedComments') {
    group = 'verification'
    description = 'Lines containing dates in main/nac/nacmod Java sources may only decrease (see checks/dated-comment-baseline.txt).'
    def sources = files(sourceSets.main.allJava, sourceSets.nac.allJava, sourceSets.nacmod.allJava)
    def baselineFile = file('checks/dated-comment-baseline.txt')
    inputs.files(sources)
    inputs.file(baselineFile)
    doLast {
        def date = ~/20\d\d-\d\d-\d\d/
        int count = 0
        sources.each { f -> f.eachLine('UTF-8') { if (it =~ date) count++ } }
        int baseline = baselineFile.text.trim() as int
        if (count > baseline) {
            throw new GradleException("代码里带日期的行从 $baseline 增加到了 $count。" +
                    '日期、版本、修改经过写进 git 提交信息；玩家可见的变化写进 CHANGELOG.md。')
        }
        if (count < baseline) {
            logger.lifecycle("带日期的行减少到 $count（基线 $baseline）。把 checks/dated-comment-baseline.txt 改成 $count，锁住这次的减少。")
        }
    }
}

tasks.named('check') {
    dependsOn 'checkMixins', 'checkDatedComments'
}

// ---------- 开发辅助：上游依赖的可读源码 ----------

// GTL 这边的依赖多是社区魔改版，没有文档，上游仓库也对不上实际版本。
// 把 libs/ 里的 jar 反编译到 deps-src/<jar 名>/（不进 git），查上游行为以这里为准。
// libs/runtime/ 放只在运行时由整合包提供、不参与编译的依赖（例如 GTL-Enhancedcore），也一起反编译。
// 已经生成过的跳过；想重新生成就删掉对应目录。Minecraft 的方法名是 SRG 形式（m_xxxxx_）。
configurations {
    decompiler
}
dependencies {
    decompiler 'org.vineflower:vineflower:1.12.0'
}
tasks.register('decompileDeps') {
    group = 'help'
    description = 'Decompile every jar in libs/ into deps-src/ (readable upstream sources, not tracked by git).'
    doLast {
        fileTree('libs').include('*.jar', 'runtime/*.jar').files.sort { it.length() }.each { jar ->
            def out = file("deps-src/${jar.name.substring(0, jar.name.length() - '.jar'.length())}")
            if (out.exists()) {
                return
            }
            logger.lifecycle("反编译 ${jar.name} …")
            out.mkdirs()
            javaexec {
                classpath = configurations.decompiler
                mainClass = 'org.jetbrains.java.decompiler.main.decompiler.ConsoleDecompiler'
                maxHeapSize = '2g'
                args '-dgs=1', '-log=WARN', '--skip-extra-files=true', jar.absolutePath, out.absolutePath
            }
        }
    }
}

tasks.named('processResources') {
    // processResources 会把 mods.toml / pack.mcmeta 里的占位符展开；展开用的字符集必须显式给 UTF-8，
    // 否则 Windows 上会按平台默认字符集（GBK）写坏文件里的中文
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            mod_id: 'gtlmodular',
            // 显示名用 \u 转义：build.gradle 在 GBK 环境下写中文会坏
            mod_name: 'GTL\u66f4\u591a\u5b9e\u7528\u8bbe\u5907',
            mod_license: 'MIT', mod_version: project.version,
            // 作者名同样用 \u 转义，避免编码问题
            mod_authors: '\u5c0f\u7231\u4e0e\u5927\u80a5\u9c7c', forge_version: '47.3.7',
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    from sourceSets.nac.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest {
        attributes([
                'Specification-Title'     : 'gtlmodular',
                'Specification-Vendor'    : 'gtlmodular',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'gtlmodular',
                'MixinConfigs'            : 'gtlmodular.mixins.json'
        ])
    }
}

tasks.named('processNacmodResources') {
    filteringCharset = 'UTF-8'
    def replaceProperties = [mod_id: 'gtl_nac', mod_version: project.version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.register('nacJar', Jar) {
    archiveBaseName = 'gtl_nac'
    from sourceSets.nac.output
    from sourceSets.nacmod.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest {
        attributes([
                'Specification-Title'     : 'gtl_nac',
                'Specification-Vendor'    : 'gtlmodular',
                'Specification-Version'   : '1',
                'Implementation-Title'    : 'gtl_nac',
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'gtlmodular',
                'MixinConfigs'            : 'gtl_nac.mixins.json'
        ])
    }
    finalizedBy 'reobfNacJar'
}

reobf {
    nacJar {
        // 独立产物的继承关系解析也不能借用 main 类输出。
        libraries.setFrom(sourceSets.nacmod.compileClasspath)
    }
}

tasks.named('build') {
    dependsOn 'reobfJar', 'reobfNacJar'
}

apply from: 'checks/product-invariants.gradle'
