plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.gtlmodular'
// 版本号只在 gradle.properties 的 mod_version 里改；mods.toml 和 jar 名都从这里取。
// 换版本后 mods 目录里的旧 jar 必须删掉：同一个 modId 两份 jar，Forge 会以 "Duplicate mod" 拒绝加载。
version = mod_version
archivesBaseName = 'gtlmodular'

// [2026-09-20] 编译 JDK 提到 21：整合包里的 gtladditions 3.2.8Custom_SubSpace-fix2 是 Java 21
//   字节码（major 65），源代码真的 import 了它的 IThreadModifierPart / CommonUtils；
//   javac 17 读 major-65 的类会直接报 "class file has wrong version 65.0, should be 61.0"。
//   注意：编译用 21，产物目标仍锁 17（下面 options.release），jar 在 JVM 17/21 都能跑。
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 不设这一行，源码里的中文会被 javac 按 GBK 读坏（本文件必须按 UTF-8 保存）
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // JDK 21 编译、字节码目标 17（等价于 javac --release 17）：产物 class 仍是 major 61
    options.release = 17
}
tasks.withType(JavaExec).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                gtlmodular {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                gtlmodular {
                    source sourceSets.main
                }
            }
        }
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'gtlmodular', '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
            mods {
                gtlmodular {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    // 依赖 jar 放在 libs/（不进 git，来源见 README.md）
    flatDir { dirs 'libs' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.7'

    // 依赖版本与 GTCEu 1.4.4 / LDLib 1.0.33.b 对齐（GTM 的传递依赖见下）
    // transitive=false：ldlib 会拖 ae2/kubejs/jei，本项目不需要 → 直接用 libs/ 下的本地 jar
    // [2026-09-15] ldlib 改用 libs/ 里的 jar：走 maven + fg.deobf 时，mapped 阶段取不到 DeobfuscatingRepo（null@pom）
    // [2026-09-20] libs/ 已同步实例当前一套：gtladditions fix2(Java21) / gtlcore 1.2.3.2-fix2 / ldlib 1.0.33.b
    // implementation fg.deobf('com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.33.b') { transitive = false }

    // 其余依赖全部来自 libs/ 下的本地 jar（含 gtceu-1.20.1-1.4.4 及其依赖）
    implementation fg.deobf(fileTree(dir: 'libs', include: ['*.jar']))
}

// ---------- 构建检查：gradlew build 会跑，不过就不能交付（规矩见 AGENTS.md） ----------

// 每个 @Mixin 类都必须登记在会被加载的 mixin 配置里。只有 mods.toml 里列出的配置会被加载，
// 没登记的 mixin 永远不生效 —— 0.3.132 里就有 7 个这样的 mixin。
tasks.register('checkMixins') {
    group = 'verification'
    description = 'Every @Mixin class must be listed in a mixin config that mods.toml loads.'
    def mixinRoot = file('src/main/java/com/gtlmodular/mixin')
    def resources = file('src/main/resources')
    def allowFile = file('checks/mixin-unregistered-allowlist.txt')
    inputs.dir(mixinRoot)
    inputs.dir(resources)
    inputs.file(allowFile)
    doLast {
        def allow = allowFile.readLines('UTF-8')*.trim().findAll { it && !it.startsWith('#') } as Set
        def toml = new File(resources, 'META-INF/mods.toml').getText('UTF-8')
        def loaded = (toml =~ /(?m)^\s*config\s*=\s*"([^"]+)"/).collect { it[1] } as Set
        def problems = []
        def registered = [] as Set
        resources.listFiles().findAll { it.name.endsWith('.mixins.json') }.each { cfg ->
            if (!(cfg.name in loaded)) {
                if (!(cfg.name in allow)) problems << "${cfg.name} 没有在 mods.toml 里登记，不会被加载"
                return
            }
            def json = new groovy.json.JsonSlurper().parseText(cfg.getText('UTF-8').replace('﻿', ''))
            ['mixins', 'client', 'server'].each { key -> (json[key] ?: []).each { registered << "${json.package}.${it}" } }
        }
        def classes = [] as Set
        fileTree(mixinRoot).include('**/*.java').each { f ->
            if (f.getText('UTF-8') =~ /(?m)^\s*@Mixin\b/) {
                def rel = mixinRoot.toPath().relativize(f.toPath()).toString().replace(File.separator, '.')
                classes << 'com.gtlmodular.mixin.' + rel.substring(0, rel.length() - '.java'.length())
            }
        }
        (registered - classes).each { problems << "登记了但找不到这个类：$it" }
        (classes - registered - allow).each { problems << "写了但没登记，不会生效：$it（登记进 gtlmodular.mixins.json，或者删掉）" }
        (allow.findAll { it.startsWith('com.') } - (classes - registered)).each {
            problems << "$it 已经登记或删除了，把它从 checks/mixin-unregistered-allowlist.txt 里去掉"
        }
        if (problems) throw new GradleException('mixin 登记检查没通过：\n  ' + problems.join('\n  '))
    }
}

// 代码里带日期的行（流水账式注释）只许减少：历史写进 git 提交信息，玩家可见的变化写进 CHANGELOG.md。
tasks.register('checkDatedComments') {
    group = 'verification'
    description = 'Lines containing dates in src/main/java may only decrease (see checks/dated-comment-baseline.txt).'
    def src = file('src/main/java')
    def baselineFile = file('checks/dated-comment-baseline.txt')
    inputs.dir(src)
    inputs.file(baselineFile)
    doLast {
        def date = ~/20\d\d-\d\d-\d\d/
        int count = 0
        fileTree(src).include('**/*.java').each { f -> f.eachLine('UTF-8') { if (it =~ date) count++ } }
        int baseline = baselineFile.text.trim() as int
        if (count > baseline) {
            throw new GradleException("代码里带日期的行从 $baseline 增加到了 $count。" +
                    '日期、版本、修改经过写进 git 提交信息；玩家可见的变化写进 CHANGELOG.md。')
        }
        if (count < baseline) {
            logger.lifecycle("带日期的行减少到 $count（基线 $baseline）。把 checks/dated-comment-baseline.txt 改成 $count，锁住这次的减少。")
        }
    }
}

tasks.named('check') {
    dependsOn 'checkMixins', 'checkDatedComments'
}

tasks.named('processResources') {
    // processResources 会把 mods.toml / pack.mcmeta 里的占位符展开；展开用的字符集必须显式给 UTF-8，
    // 否则 Windows 上会按平台默认字符集（GBK）写坏文件里的中文
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            mod_id: 'gtlmodular',
            // 显示名用 \u 转义：build.gradle 在 GBK 环境下写中文会坏
            mod_name: 'GTL\u66f4\u591a\u5b9e\u7528\u8bbe\u5907',
            mod_license: 'MIT', mod_version: project.version,
            // 作者名同样用 \u 转义，避免编码问题
            mod_authors: '\u5c0f\u7231\u4e0e\u5927\u80a5\u9c7c', forge_version: '47.3.7',
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'gtlmodular',
                'Specification-Vendor'    : 'gtlmodular',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'gtlmodular',
                'MixinConfigs'            : 'gtlmodular.mixins.json'
        ])
    }
}
